<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>WARLANDS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Crimson+Pro:ital,wght@0,300;0,600;1,300&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--gold:#f0b930;--gd:#c8920a;--ink:#0d0700;--bg:#08060a;--panel:#100a00;--border:#2a1a00;--parch:#e8d5a3;--dim:#6a4a1a;--red:#cc1111;--rd:#8b0000;--grn:#22aa44}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--parch);font-family:'Crimson Pro',serif;touch-action:none;user-select:none}
#app{display:flex;flex-direction:column;height:100dvh}
header{background:#0d0800;border-bottom:2px solid var(--gd);padding:0 8px;height:44px;display:flex;align-items:center;gap:6px;flex-shrink:0;z-index:20}
.logo{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(.8rem,3vw,1.2rem);letter-spacing:.2em;color:var(--gold);white-space:nowrap}
.logo em{color:var(--red);font-style:normal}
.hrow{display:flex;gap:4px;align-items:center;margin-left:auto;flex-wrap:nowrap}
.hbtn{font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.05em;padding:3px 7px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;border-radius:3px;white-space:nowrap;transition:all .12s}
.hbtn.active{background:var(--gd);color:var(--ink);border-color:var(--gold)}
.hbtn.go{border-color:#224400;color:var(--grn)}
.hbtn.go.active{background:var(--grn);color:#fff;border-color:#44ff44}
.sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
.spdr{display:flex;gap:3px;align-items:center}
.spd{font-family:'Cinzel',serif;font-size:.5rem;padding:3px 5px;border:1px solid var(--border);background:#1a1000;color:var(--dim);cursor:pointer;border-radius:2px}
.spd.active{background:var(--gd);color:var(--ink);border-color:var(--gold)}
#cw{flex:1;position:relative;overflow:hidden;background:#0a1a2c;min-height:0}
#mc{position:absolute;top:0;left:0;touch-action:none;cursor:crosshair}
#sb{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:rgba(8,4,0,.92);border:1px solid var(--gd);padding:3px 12px;border-radius:20px;font-size:.6rem;color:var(--gold);pointer-events:none;z-index:10;white-space:nowrap;font-family:'Cinzel',serif;letter-spacing:.04em;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#etick{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:rgba(100,0,0,.9);border:1px solid #ff4444;padding:3px 14px;border-radius:20px;font-size:.58rem;color:#ffbbbb;pointer-events:none;z-index:10;display:none;white-space:nowrap;font-family:'Cinzel',serif;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.tt{position:absolute;background:rgba(8,4,0,.95);border:1px solid var(--gd);padding:3px 8px;font-size:.66rem;pointer-events:none;display:none;z-index:25;white-space:nowrap;border-radius:2px}
#drawer{background:var(--panel);border-top:2px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;max-height:44vh}
.dtabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none;background:#0d0800}
.dtabs::-webkit-scrollbar{display:none}
.dtab{font-family:'Cinzel',serif;font-size:.54rem;letter-spacing:.06em;padding:8px 10px;border:none;background:transparent;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.dtab.active{color:var(--gold);border-bottom-color:var(--gold)}
.dcont{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dp{display:none;padding:9px 11px}
.dp.active{display:block}
.trow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:7px}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;background:#1a1000;border:1px solid var(--border);border-radius:3px;color:var(--parch);font-family:'Cinzel',serif;font-size:.44rem;cursor:pointer}
.tbtn.active{border-color:var(--gold);background:#2a1800;color:var(--gold)}
.ti{font-size:1rem;line-height:1}
.brow{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.brow label{font-size:.62rem;color:var(--dim);white-space:nowrap}
.brow input{flex:1;accent-color:var(--gd)}
.bval{font-size:.66rem;color:var(--gold);min-width:16px;text-align:right}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
@media(min-width:480px){.tgrid{grid-template-columns:repeat(5,1fr)}}
.trbtn{display:flex;align-items:center;gap:4px;padding:5px 6px;background:#1a1000;border:2px solid var(--border);border-radius:3px;cursor:pointer;font-size:.57rem;color:var(--parch)}
.trbtn.active{border-color:white}
.trmod{color:var(--dim);font-size:.49rem}
.clist{display:flex;flex-direction:column;gap:4px;max-height:190px;overflow-y:auto}
.citem{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#1a1000;border:1px solid var(--border);border-radius:3px;cursor:pointer}
.citem.sel{border-color:var(--gold);background:#251800}
.cdot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.2)}
.cn{flex:1;font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct{font-size:.57rem;color:var(--dim);white-space:nowrap}
.cai{font-size:.49rem;padding:2px 4px;background:#0d1500;border:1px solid #1a2800;color:#44bb44;border-radius:2px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cai.on{background:#0d2000;border-color:#33aa00;color:#88ff44}
.cdel{font-size:.62rem;padding:1px 4px;background:none;border:none;cursor:pointer;color:#883322;flex-shrink:0}
.acbtn{width:100%;margin-top:6px;padding:7px;background:transparent;border:1px dashed var(--border);color:var(--dim);font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.1em;cursor:pointer;border-radius:3px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mbtn{padding:10px 8px;background:#1a1000;border:1px solid var(--border);border-radius:4px;cursor:pointer;text-align:center;transition:all .15s}
.mbtn:hover{border-color:var(--gold);background:#251800}
.mbtn .mi{font-size:1.5rem;display:block;margin-bottom:3px}
.mbtn .mn{font-family:'Cinzel',serif;font-size:.56rem;color:var(--gold);letter-spacing:.06em}
.mbtn .md{font-size:.54rem;color:var(--dim);margin-top:2px}
.cgrd{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;margin-bottom:7px}
.selb{width:100%;padding:5px 6px;background:#080500;border:1px solid var(--border);color:var(--parch);font-family:'Crimson Pro',serif;font-size:.8rem;border-radius:2px;-webkit-appearance:none}
.selb:focus{outline:none;border-color:var(--gd)}
.clbl{font-family:'Cinzel',serif;font-size:.51rem;letter-spacing:.06em;color:var(--dim);margin-bottom:2px}
.vsb{font-family:'Cinzel',serif;font-weight:900;color:var(--red);font-size:.92rem;text-align:center;padding-top:14px}
.hpbg{height:7px;background:#050300;border-radius:2px;overflow:hidden;margin:2px 0 4px}
.hpf{height:100%;border-radius:2px;transition:width .4s ease}
.blog{height:90px;overflow-y:auto;background:#050300;border:1px solid var(--border);border-radius:2px;padding:4px 7px;font-size:.64rem;line-height:1.6;margin-bottom:6px}
.li{color:var(--dim);font-style:italic}.la{color:#ff7744}.ld{color:#55aaff}.lw{color:var(--gold);font-weight:600}.lr{color:#ff44ff}
.btn{width:100%;padding:8px;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.1em;cursor:pointer;border-radius:3px;border:none;margin-bottom:4px}
.bfight{background:linear-gradient(180deg,var(--red),var(--rd));color:#fff;border:1px solid #ff4444;box-shadow:0 0 8px rgba(139,0,0,.3)}
.bfight:disabled{opacity:.4;cursor:not-allowed}
.bsec{background:#1a1000;border:1px solid var(--border);color:var(--dim)}
.sblk{background:#150e00;border:1px solid var(--border);border-radius:3px;padding:6px 8px;margin-bottom:5px}
.stit{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.1em;color:var(--gd);margin-bottom:3px}
.smin{font-size:.66rem;color:var(--dim);line-height:1.8}
.smin b{color:var(--gold)}
.evlog{font-size:.66rem;display:flex;flex-direction:column;gap:1px}
.evrow{padding:2px 0;border-bottom:1px solid var(--border)}
/* Alliance styles */
.alblk{background:#0d1a00;border:1px solid var(--border);border-radius:3px;padding:7px 9px;margin-bottom:6px}
.altit{font-family:'Cinzel',serif;font-size:.54rem;letter-spacing:.1em;margin-bottom:4px}
.almem{font-size:.62rem;color:var(--dim);display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
.almem span{padding:1px 5px;border-radius:2px;font-size:.56rem}
.albtn{font-family:'Cinzel',serif;font-size:.48rem;padding:2px 6px;border-radius:2px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer}
.albtn:hover{border-color:var(--gold);color:var(--gold)}
.wtbl{font-size:.66rem;width:100%;border-collapse:collapse}
.wtbl td,.wtbl th{padding:3px 5px;border-bottom:1px solid var(--border);white-space:nowrap}
.wtbl th{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.07em;color:var(--gd)}
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);align-items:center;justify-content:center;z-index:999;padding:14px}
.mbg.open{display:flex}
.modal{background:linear-gradient(180deg,#1e1200,#110900);border:1px solid var(--gd);border-radius:6px;padding:16px;width:100%;max-width:300px;box-shadow:0 0 40px rgba(200,146,10,.2)}
.modal h3{font-family:'Cinzel',serif;color:var(--gold);margin-bottom:11px;font-size:.8rem;letter-spacing:.12em}
.modal label{font-size:.62rem;color:var(--dim);display:block;margin-bottom:3px}
.modal input[type=text]{width:100%;padding:6px 8px;background:#080500;border:1px solid var(--border);color:var(--parch);font-size:.88rem;border-radius:2px;margin-bottom:9px;font-family:'Crimson Pro',serif}
.modal input[type=text]:focus{outline:none;border-color:var(--gd)}
.crow{display:flex;align-items:center;gap:7px;margin-bottom:12px}
.modal input[type=color]{width:40px;height:34px;border:1px solid var(--border);background:none;cursor:pointer;border-radius:2px;padding:2px;flex-shrink:0}
.plist{display:flex;flex-wrap:wrap;gap:4px}
.pdot{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .1s}
.pdot.sel{border-color:white;transform:scale(1.2)}
.mbtns{display:flex;gap:6px}
.mok{flex:1;padding:8px;background:var(--gd);color:var(--ink);font-family:'Cinzel',serif;font-size:.66rem;letter-spacing:.1em;border:none;cursor:pointer;border-radius:2px}
.mcancel{flex:1;padding:8px;background:#1a1000;border:1px solid var(--border);color:var(--dim);font-family:'Cinzel',serif;font-size:.66rem;cursor:pointer;border-radius:2px}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">WAR<em>LANDS</em></div>
    <div class="hrow">
      <button class="hbtn active" id="tab-draw" onclick="setMode('draw')">✏️ MAP</button>
      <button class="hbtn" id="tab-battle" onclick="setMode('battle')">⚔️ BATTLE</button>
      <button class="hbtn" id="tab-events" onclick="setMode('events')">📜 EVENTS</button>
      <div class="sep"></div>
      <div class="spdr" id="spdrow" style="display:none">
        <button class="spd" data-s="1" onclick="setSpeed(1)">1×</button>
        <button class="spd" data-s="3" onclick="setSpeed(3)">3×</button>
        <button class="spd active" data-s="5" onclick="setSpeed(5)">5×</button>
        <button class="spd" data-s="15" onclick="setSpeed(15)">15×</button>
      </div>
      <button class="hbtn go" id="ai-btn" onclick="toggleAI()">▶ AI</button>
    </div>
  </header>
  <div id="cw">
    <canvas id="mc"></canvas>
    <div id="sb">WARLANDS — Load a map or draw your own, then start AI!</div>
    <div id="etick"></div>
    <div class="tt" id="tt"></div>
  </div>
  <div id="drawer">
    <div class="dtabs" id="dtabs"></div>
    <div class="dcont" id="dcont"></div>
  </div>
</div>
<div class="mbg" id="mbg">
  <div class="modal">
    <h3>⚑ NEW COUNTRY</h3>
    <label>Name</label>
    <input type="text" id="mname" placeholder="e.g. Valdoria" maxlength="22" autocomplete="off">
    <label>Color</label>
    <div class="crow">
      <input type="color" id="mcolor" value="#cc3333">
      <div class="plist" id="plist"></div>
    </div>
    <div class="mbtns">
      <button class="mok" onclick="confirmC()">FOUND</button>
      <button class="mcancel" onclick="closeM()">CANCEL</button>
    </div>
  </div>
</div>
<script>
const COLS=160,ROWS=100;
const O=0,PL=1,FO=2,MT=3,DE=4,FA=5,SN=6,SW=7,TU=8,SA=9;
const TR=[
  {n:'Ocean',   e:'🌊',c:'#1a3a5c',a:-2,d:0, p:0 },
  {n:'Plains',  e:'🟩',c:'#5a8a3c',a:0, d:0, p:0 },
  {n:'Forest',  e:'🌲',c:'#2d5016',a:0, d:1, p:0 },
  {n:'Mountain',e:'⛰️',c:'#5a4a3a',a:0, d:2, p:0 },
  {n:'Desert',  e:'🏜️',c:'#c8a044',a:0, d:-1,p:0 },
  {n:'Farmland',e:'🌾',c:'#8aaa44',a:0, d:0, p:1 },
  {n:'Snow',    e:'❄️',c:'#c8d8e8',a:-1,d:1, p:-1},
  {n:'Swamp',   e:'🌿',c:'#4a6040',a:-1,d:1, p:0 },
  {n:'Tundra',  e:'🏔️',c:'#909880',a:-1,d:0, p:-1},
  {n:'Savanna', e:'🌅',c:'#b8943c',a:1, d:-1,p:0 },
];
const PC=['#cc3333','#3355cc','#22aa44','#cc8822','#9922cc','#22aacc','#cc2288','#cc9900','#ee4400','#888888'];
const CN=['Ironhold','Duskport','Ashenvale','Goldmere','Stormgate','Crownspire','Embermoor','Coldwatch','Sandrift','Thornwall','Mosshaven','Cinderfall','Brightwater','Graykeep','Shadowfen','Dawnreach','Frostholm','Stonemark','Tidecross','Wolfpeak','Sunbarrow','Dustcrown','Highspire','Darkfall','Mistholm','Saltmere','Bloodstone','Firwatch','Silverbend','Ironcliff','Mudwater','Greenwall','Coldmoor','Emberwatch','Riverstone','Goldcrest'];
const RN=['Free','New','Republic of','Peoples','United','Democratic','Independent','Great','Northern','Southern'];
const RNN=['Lands','Republic','State','Nation','Kingdom','Federation','Alliance'];

let grid=new Uint8Array(COLS*ROWS),owner=new Int16Array(COLS*ROWS).fill(-1);
// FIX: 'revolts' declared only once here (was duplicated inside toggleAI causing a shadowing bug)
let countries=[],cities=[],wars=[],evlog=[],revolts=[],fleets=[];
// alliances: array of {id, name, members:[cid,...], color}
let alliances=[];
let tool='paint',terrain=PL,selC=-1,brush=4;
let mode='draw',painting=false;
let camX=0,camY=0,camZ=4,panStart=null,lastPinch=0;
let aiOn=false,aiSpeed=5,aiTimer=null,manTimer=null,tick=0;

const TRGB=TR.map(t=>[parseInt(t.c.slice(1,3),16),parseInt(t.c.slice(3,5),16),parseInt(t.c.slice(5,7),16)]);
// FIX: use a plain object for CRGB cache; reset by reassigning on map load
let CRGB={};
function crgb(h){if(CRGB[h])return CRGB[h];const r=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];CRGB[h]=r;return r;}

let canvas,ctx,vpW,vpH,offC,offX,iData;
function initCanvas(){
  canvas=document.getElementById('mc');ctx=canvas.getContext('2d');
  fit();new ResizeObserver(fit).observe(document.getElementById('cw'));
  canvas.addEventListener('mousedown',oMD);canvas.addEventListener('mousemove',oMM);
  canvas.addEventListener('mouseup',oMU);canvas.addEventListener('mouseleave',oML);
  canvas.addEventListener('wheel',oW,{passive:false});canvas.addEventListener('contextmenu',e=>e.preventDefault());
  canvas.addEventListener('touchstart',oTS,{passive:false});canvas.addEventListener('touchmove',oTM,{passive:false});canvas.addEventListener('touchend',oTE,{passive:false});
}
function fit(){
  const w=document.getElementById('cw');
  vpW=w.clientWidth;vpH=w.clientHeight;
  canvas.width=vpW;canvas.height=vpH;
  // Always fit entire map to screen, respecting both axes
  camZ=Math.min(vpW/COLS, vpH/ROWS);
  // Centre the map
  camX=(COLS*camZ-vpW)/2;
  camY=(ROWS*camZ-vpH)/2;
  clamp();redraw();
}
function clamp(){
  const maxX=Math.max(0,COLS*camZ-vpW);
  const maxY=Math.max(0,ROWS*camZ-vpH);
  camX=Math.max(0,Math.min(camX,maxX));
  camY=Math.max(0,Math.min(camY,maxY));
}
function getOff(){if(!offC){offC=document.createElement('canvas');offC.width=COLS;offC.height=ROWS;offX=offC.getContext('2d',{willReadFrequently:true});}return{offC,offX};}
function buildPx(){
  if(!iData||iData.width!==COLS)iData=new ImageData(COLS,ROWS);
  const d=iData.data;
  for(let i=0;i<COLS*ROWS;i++){
    const tr=TRGB[grid[i]];const cid=owner[i];
    let r,g,b;
    if(cid>=0&&countries[cid]){const cr=crgb(countries[cid].color);r=(tr[0]*.62+cr[0]*.38)|0;g=(tr[1]*.62+cr[1]*.38)|0;b=(tr[2]*.62+cr[2]*.38)|0;}
    else{r=tr[0];g=tr[1];b=tr[2];}
    const p=i<<2;d[p]=r;d[p+1]=g;d[p+2]=b;d[p+3]=255;
  }
}
function redraw(){
  if(!ctx||!vpW)return;
  buildPx();const{offC:oc,offX:ox}=getOff();ox.putImageData(iData,0,0);
  ctx.clearRect(0,0,vpW,vpH);ctx.imageSmoothingEnabled=camZ<5;
  ctx.drawImage(oc,0,0,COLS,ROWS,-camX,-camY,COLS*camZ,ROWS*camZ);
  const cs=camZ;
  if(cs>=2){
    const dr=Math.max(2,cs*.38);
    cities.forEach(city=>{
      const sx=city.x*cs-camX+cs*.5,sy=city.y*cs-camY+cs*.5;
      if(sx<-10||sx>vpW+10||sy<-10||sy>vpH+10)return;
      const col=city.color||'#fff';
      if(city.isCapital){
        // Capital: gold star ring + crown emoji
        const cr=dr*2.2;
        ctx.beginPath();ctx.arc(sx,sy,cr*1.8,0,6.28);ctx.fillStyle=col+'44';ctx.fill();
        ctx.beginPath();ctx.arc(sx,sy,cr,0,6.28);ctx.fillStyle='#f0b930';ctx.fill();
        ctx.beginPath();ctx.arc(sx,sy,cr*.65,0,6.28);ctx.fillStyle=col;ctx.fill();
        if(cs>=5){
          ctx.font=`${Math.max(10,cr*1.4)|0}px serif`;
          ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText('★',sx,sy);
        }
        if(cs>=7){
          ctx.font=`bold ${Math.max(8,cs*.42|0)}px serif`;
          ctx.textAlign='center';
          const tw=ctx.measureText(city.name).width;
          ctx.fillStyle='rgba(0,0,0,.75)';
          ctx.fillRect(sx-tw/2-2,sy+cr+1,tw+4,Math.max(9,cs*.42)+2);
          ctx.fillStyle='#f0b930';
          ctx.fillText(city.name,sx,sy+cr+Math.max(9,cs*.42));
        }
      } else {
        ctx.beginPath();ctx.arc(sx,sy,dr*2.4,0,6.28);ctx.fillStyle=col+'33';ctx.fill();
        ctx.beginPath();ctx.arc(sx,sy,dr,0,6.28);ctx.fillStyle='#fff';ctx.fill();
        ctx.beginPath();ctx.arc(sx,sy,dr*.6,0,6.28);ctx.fillStyle=col;ctx.fill();
        if(cs>=7){ctx.font=`bold ${Math.max(8,cs*.38|0)}px serif`;ctx.textAlign='center';const tw=ctx.measureText(city.name).width;ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(sx-tw/2-2,sy+dr+1,tw+4,Math.max(9,cs*.38)+2);ctx.fillStyle='#fff';ctx.fillText(city.name,sx,sy+dr+Math.max(9,cs*.38));}
      }
    });
  }
  if(cs>=3){
    ctx.lineWidth=Math.max(.7,cs*.11);
    for(let r2=0;r2<ROWS;r2++){const sy=r2*cs-camY;if(sy>vpH+cs||sy+cs<0)continue;
      for(let c2=0;c2<COLS;c2++){const sx=c2*cs-camX;if(sx>vpW+cs||sx+cs<0)continue;
        const idx=r2*COLS+c2,cid=owner[idx];if(cid<0||!countries[cid])continue;
        // Normal country border
        ctx.strokeStyle=countries[cid].color;
        if(c2<COLS-1&&owner[idx+1]!==cid){ctx.beginPath();ctx.moveTo(sx+cs,sy);ctx.lineTo(sx+cs,sy+cs);ctx.stroke();}
        if(r2<ROWS-1&&owner[idx+COLS]!==cid){ctx.beginPath();ctx.moveTo(sx,sy+cs);ctx.lineTo(sx+cs,sy+cs);ctx.stroke();}
      }
    }
    // Alliance glow: thick dashed line between DIFFERENT alliance members' borders
    if(alliances.length&&cs>=3){
      ctx.setLineDash([Math.max(2,cs*.3),Math.max(1,cs*.15)]);
      ctx.lineWidth=Math.max(1.5,cs*.22);
      for(let r2=0;r2<ROWS;r2+=2){const sy=r2*cs-camY;if(sy>vpH+cs||sy+cs<0)continue;
        for(let c2=0;c2<COLS;c2+=2){const sx=c2*cs-camX;if(sx>vpW+cs||sx+cs<0)continue;
          const idx=r2*COLS+c2,cid=owner[idx];if(cid<0)continue;
          const al=getAlliance(cid);if(!al)continue;
          // Check right neighbour
          if(c2+2<COLS){const rid=owner[r2*COLS+c2+2];if(rid>=0&&rid!==cid&&getAlliance(rid)?.id===al.id){
            ctx.strokeStyle=al.color+'cc';ctx.beginPath();ctx.moveTo(sx+cs*2,sy);ctx.lineTo(sx+cs*2,sy+cs*2);ctx.stroke();}}
          // Check bottom neighbour
          if(r2+2<ROWS){const bid=owner[(r2+2)*COLS+c2];if(bid>=0&&bid!==cid&&getAlliance(bid)?.id===al.id){
            ctx.strokeStyle=al.color+'cc';ctx.beginPath();ctx.moveTo(sx,sy+cs*2);ctx.lineTo(sx+cs*2,sy+cs*2);ctx.stroke();}}
        }
      }
      ctx.setLineDash([]);
    }
  }
  wars.forEach(w=>{if(w.done||w.fx==null)return;const sx=w.fx*cs-camX+cs*.5,sy=w.fy*cs-camY+cs*.5;const g2=ctx.createRadialGradient(sx,sy,0,sx,sy,Math.max(12,cs*2.8));g2.addColorStop(0,'rgba(255,80,0,.6)');g2.addColorStop(1,'rgba(255,80,0,0)');ctx.beginPath();ctx.arc(sx,sy,Math.max(12,cs*2.8),0,6.28);ctx.fillStyle=g2;ctx.fill();});
  revolts.forEach(rv=>{if(!rv.flash)return;const sx=rv.x*cs-camX+cs*.5,sy=rv.y*cs-camY+cs*.5;const g2=ctx.createRadialGradient(sx,sy,0,sx,sy,Math.max(8,cs*2));g2.addColorStop(0,'rgba(255,0,255,.7)');g2.addColorStop(1,'rgba(255,0,255,0)');ctx.beginPath();ctx.arc(sx,sy,Math.max(8,cs*2),0,6.28);ctx.fillStyle=g2;ctx.fill();});
  // Draw fleets as animated ships on the ocean
  fleets.forEach(f=>{
    const sx=f.x*cs-camX+cs*.5,sy=f.y*cs-camY+cs*.5;
    if(sx<-20||sx>vpW+20||sy<-20||sy>vpH+20)return;
    const col=countries[f.attId]?.color||'#fff';
    const r=Math.max(4,cs*.55);
    // Wake trail
    ctx.beginPath();ctx.arc(sx,sy,r*2.5,0,6.28);
    const wg=ctx.createRadialGradient(sx,sy,0,sx,sy,r*2.5);
    wg.addColorStop(0,col+'55');wg.addColorStop(1,'transparent');
    ctx.fillStyle=wg;ctx.fill();
    // Ship body
    ctx.beginPath();ctx.arc(sx,sy,r,0,6.28);ctx.fillStyle='#fff';ctx.fill();
    ctx.beginPath();ctx.arc(sx,sy,r*.6,0,6.28);ctx.fillStyle=col;ctx.fill();
    // Ship icon
    if(cs>=4){ctx.font=`${Math.max(8,r*1.6)|0}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⛵',sx,sy);}
    // Direction arrow toward next waypoint
    if(f.wpIdx<f.waypts.length){
      const[tc,tr]=f.waypts[f.wpIdx];
      const tx=tc*cs-camX+cs*.5,ty=tr*cs-camY+cs*.5;
      const dx=tx-sx,dy=ty-sy,dl=Math.sqrt(dx*dx+dy*dy)||1;
      ctx.strokeStyle=col+'99';ctx.lineWidth=Math.max(1,cs*.12);ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+dx/dl*r*3,sy+dy/dl*r*3);ctx.stroke();
      ctx.setLineDash([]);
    }
  });
}

function oMD(e){if(mode==='draw'){painting=true;applyAt(e.offsetX,e.offsetY);}else{panStart={x:e.clientX+camX,y:e.clientY+camY};}}
function oMM(e){if(mode==='draw'){if(painting)applyAt(e.offsetX,e.offsetY);showTip(e.offsetX,e.offsetY);}else if(panStart){camX=panStart.x-e.clientX;camY=panStart.y-e.clientY;clamp();redraw();}}
function oMU(){painting=false;panStart=null;rclList();}
function oML(){painting=false;panStart=null;document.getElementById('tt').style.display='none';}
function oW(e){e.preventDefault();const f=e.deltaY<0?1.15:.87;const bc=(e.offsetX+camX)/camZ,br=(e.offsetY+camY)/camZ;const minZ=Math.min(vpW/COLS,vpH/ROWS);camZ=Math.max(minZ,Math.min(50,camZ*f));camX=bc*camZ-e.offsetX;camY=br*camZ-e.offsetY;clamp();redraw();}
function oTS(e){e.preventDefault();if(e.touches.length===2)lastPinch=pd(e);else if(e.touches.length===1){const t=e.touches[0],rc=canvas.getBoundingClientRect();if(mode==='draw'){painting=true;applyAt(t.clientX-rc.left,t.clientY-rc.top);}else panStart={x:t.clientX+camX,y:t.clientY+camY};}}
function oTM(e){e.preventDefault();if(e.touches.length===2){const d=pd(e),f=d/lastPinch;const mx=(e.touches[0].clientX+e.touches[1].clientX)/2,my=(e.touches[0].clientY+e.touches[1].clientY)/2;const rc=canvas.getBoundingClientRect(),ox=mx-rc.left,oy=my-rc.top;const bc=(ox+camX)/camZ,br=(oy+camY)/camZ;const minZ=Math.min(vpW/COLS,vpH/ROWS);camZ=Math.max(minZ,Math.min(50,camZ*f));camX=bc*camZ-ox;camY=br*camZ-oy;clamp();redraw();lastPinch=d;}else if(e.touches.length===1){const t=e.touches[0],rc=canvas.getBoundingClientRect();if(mode==='draw'&&painting)applyAt(t.clientX-rc.left,t.clientY-rc.top);else if(panStart){camX=panStart.x-t.clientX;camY=panStart.y-t.clientY;clamp();redraw();}}}
function oTE(e){e.preventDefault();painting=false;panStart=null;rclList();}
function pd(e){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;return Math.sqrt(dx*dx+dy*dy);}
function showTip(sx,sy){
  const col=(sx+camX)/camZ|0,row=(sy+camY)/camZ|0;
  if(col<0||col>=COLS||row<0||row>=ROWS)return;
  const idx=row*COLS+col,t=TR[grid[idx]],cid=owner[idx];
  const c=cid>=0&&countries[cid]?countries[cid]:null;
  const cn=c?c.name:'Unclaimed';
  const eco=c?` · 💰${c.gold} 👥${c.pop}k`:'';
  const city=cities.find(c=>c.x===col&&c.y===row);
  const el=document.getElementById('tt');
  el.style.display='block';el.style.left=(sx+14)+'px';el.style.top=(sy+14)+'px';
  el.textContent=`${t.e} ${t.n}${city?(city.isCapital?' ★ CAPITAL ':' 🏙 ')+city.name:''} · ${cn}${eco}`;
}

function applyAt(sx,sy){
  const col=(sx+camX)/camZ|0,row=(sy+camY)/camZ|0;
  if(col<0||col>=COLS||row<0||row>=ROWS)return;
  const idx=row*COLS+col;
  if(tool==='eyedrop'){terrain=grid[idx];updTBtns();return;}
  if(tool==='fill'){flood(col,row,grid[idx],terrain,selC);redraw();return;}
  if(tool==='city'){placeCity(col,row);redraw();return;}
  const h=brush>>1;
  for(let dr=-h;dr<=h;dr++)for(let dc=-h;dc<=h;dc++){const rr=row+dr,cc=col+dc;if(rr<0||rr>=ROWS||cc<0||cc>=COLS)continue;const i=rr*COLS+cc;if(tool==='paint'){grid[i]=terrain;owner[i]=selC;}else if(tool==='erase'){grid[i]=O;owner[i]=-1;const ci=cities.findIndex(c=>c.x===cc&&c.y===rr);if(ci>=0)cities.splice(ci,1);}}
  redraw();
}
function flood(col,row,fT,tT,tO){const stk=[[col,row]],seen=new Set();while(stk.length){const[c,r]=stk.pop();if(c<0||c>=COLS||r<0||r>=ROWS)continue;const k=r*COLS+c;if(seen.has(k)||grid[k]!==fT)continue;seen.add(k);grid[k]=tT;owner[k]=tO;stk.push([c+1,r],[c-1,r],[c,r+1],[c,r-1]);}}
function placeCity(col,row){
  if(grid[row*COLS+col]===O)return;
  const ei=cities.findIndex(c=>c.x===col&&c.y===row);
  if(ei>=0){cities.splice(ei,1);return;}
  const cid=owner[row*COLS+col];
  const color=cid>=0&&countries[cid]?countries[cid].color:'#ffffff';
  // Auto-capital: if this country has no capital yet, make this one it
  const hasCapital=cid>=0&&cities.some(c=>c.cid===cid&&c.isCapital);
  cities.push({x:col,y:row,name:CN[Math.random()*CN.length|0],cid,color,isCapital:cid>=0&&!hasCapital});
}

function addC(name,color,opts={}){
  const id=countries.length;
  countries.push({
    id,name,color,
    aiEnabled:opts.ai||false,
    aggression:opts.ag!==undefined?opts.ag:.3+Math.random()*.45,
    loyalty:opts.ly!==undefined?opts.ly:.6+Math.random()*.3,
    defensiveness:.5+Math.random()*.4,
    peaceTimer:0,
    isRebel:opts.rebel||false,
    morale: opts.morale!==undefined ? opts.morale : 0.85+Math.random()*.3, // national morale 0-1.3
    // ── ECONOMY ──
    gold: opts.gold!==undefined ? opts.gold : 80+Math.random()*120|0,  // starting treasury
    pop:  opts.pop !==undefined ? opts.pop  : 50+Math.random()*100|0,  // population (thousands)
    popGrowthAcc:0,   // accumulator for fractional pop growth each tick
  });
  return id;
}
function countT(id){let n=0;for(let i=0;i<owner.length;i++)if(owner[i]===id)n++;return n;}
function rclList(){
  const list=document.getElementById('clist');if(!list)return;

  countries.forEach(c=>{
    const tiles=countT(c.id);
    const it=mk('div','citem'+(selC===c.id?' sel':''));

      `<span class="cn">${c.name}${c.isRebel?' ⚡':''}</span>`+

      `<span class="ct" style="color:#44cc88" title="Population">👥${c.pop||0}k</span>`+
      `<button class="cai${c.aiEnabled?' on':''}" onclick="togAI(${c.id},event)">${c.aiEnabled?'🤖':'💤'}</button>`+
      `<button class="cdel" onclick="delC(${c.id},event)">✕</button>`;
    it.onclick=()=>{selC=c.id;rclList();};

function togAI(id,e){e.stopPropagation();const c=countries[id];if(c)c.aiEnabled=!c.aiEnabled;rclList();}
function mk(tag,cls=''){const e=document.createElement(tag);e.className=cls;return e;}
function delC(id,e){e.stopPropagation();if(!confirm(`Remove ${countries[id]?.name}?`))return;for(let i=0;i<owner.length;i++)if(owner[i]===id)owner[i]=-1;countries.splice(id,1);countries.forEach((c,ni)=>{const old=c.id;c.id=ni;for(let i=0;i<owner.length;i++)if(owner[i]===old)owner[i]=ni;});cities.forEach(c=>{if(c.cid===id)c.cid=-1;else if(c.cid>id)c.cid--;});if(selC>=countries.length)selC=-1;rclList();fillSels();redraw();}

function loadMap(name){
  // FIX: fully reset all state arrays before loading a new map
  // Previously 'countries' was not reset, causing new map countries to append to old ones
  // and wars were not cleared, leaving stale war objects with invalid country IDs
  grid.fill(O);owner.fill(-1);
  cities.length=0;wars.length=0;revolts.length=0;evlog.length=0;fleets.length=0;
  countries.length=0;alliances.length=0;allianceIdSeq=0;
  selC=-1;
  CRGB={};coastCache={};coastDirty=true;
  if(name==='usa')buildUSA();else if(name==='world')buildWorld();else if(name==='europe')buildEurope();else buildFantasy();
  camZ=Math.min(vpW/COLS,vpH/ROWS);
  camX=(COLS*camZ-vpW)/2;
  camY=(ROWS*camZ-vpH)/2;
  redraw();
  // FIX: rebuild drawer so country lists and selects reflect the new map
  buildDrawer();
  fillSels();
  refreshStats();
  showTab('countries');
  addEv(`🗺️ Map loaded: ${name.toUpperCase()}`,'li');
  updStatus();
}

// ── COAST CACHE ──
// Rebuilt only when tiles change (map load, conquest, revolt)
// Maps cid -> [{col,row}]  or  cid -> false (landlocked)
let coastCache={};
let coastDirty=true; // set true whenever owner[] changes significantly

function dirtyCoast(){coastDirty=true;}

function rebuildCoastCache(){
  coastCache={};
  // Build per-country coast lists in one O(N) pass
  const tmp={};
  for(let row=0;row<ROWS;row++){
    for(let col=0;col<COLS;col++){
      const idx=row*COLS+col;
      const cid=owner[idx];
      if(cid<0||grid[idx]===O)continue;
      // check 4 neighbours for ocean
      let adj=false;
      if(col>0      && grid[idx-1]===O)adj=true;
      if(!adj&&col<COLS-1 && grid[idx+1]===O)adj=true;
      if(!adj&&row>0      && grid[idx-COLS]===O)adj=true;
      if(!adj&&row<ROWS-1 && grid[idx+COLS]===O)adj=true;
      if(adj){
        if(!tmp[cid])tmp[cid]=[];
        // Only store every 3rd tile to keep arrays small
        if((row+col)%3===0)tmp[cid].push({col,row});
      }
    }
  }
  countries.forEach(c=>{coastCache[c.id]=tmp[c.id]||null;});
  coastDirty=false;
}

function getCoast(cid){
  if(coastDirty)rebuildCoastCache();
  return coastCache[cid]||[];
}

function isCoastal(cid){
  if(coastDirty)rebuildCoastCache();
  return !!(coastCache[cid]&&coastCache[cid].length>0);
}

// Nearest sea-lane waypoint to a grid position
function nearestLanePoint(col,row){
  let best=null,bd=Infinity;
  for(const lane of SEA_LANES){
    for(const[lc,lr] of lane.pts){
      const d=Math.abs(lc-col)+Math.abs(lr-row);
      if(d<bd){bd=d;best={lane,lc,lr};}
    }
  }
  return best;
}

// Can two countries fight across water?
function canNavalAttack(attId,defId){
  return isCoastal(attId)&&isCoastal(defId);
}

// Launch a fleet
function launchFleet(attId,defId){
  const ac2=getCoast(attId),dc=getCoast(defId);
  if(!ac2.length||!dc.length)return;
  const origin=ac2[Math.random()*ac2.length|0];
  const dest  =dc  [Math.random()*dc.length|0];
  const lp =nearestLanePoint(origin.col,origin.row);
  const lp2=nearestLanePoint(dest.col,dest.row);
  const waypts=[[origin.col,origin.row]];
  if(lp) waypts.push([lp.lc,lp.lr]);
  if(lp&&lp2&&lp.lane===lp2.lane){
    lp.lane.pts.forEach(p=>waypts.push(p));
  } else {
    waypts.push([80,50]); // mid-ocean crossover
  }
  if(lp2)waypts.push([lp2.lc,lp2.lr]);
  waypts.push([dest.col,dest.row]);
  fleets.push({attId,defId,waypts,wpIdx:0,x:origin.col,y:origin.row,arrived:false,age:0});
  addEv(`⛵ ${countries[attId].name} launches navy → ${countries[defId].name}`,'ld');
  ticker2(`⛵ ${countries[attId].name} sails to attack ${countries[defId].name}!`);
}

// Advance fleets one step
function stepFleets(){
  fleets=fleets.filter(f=>{
    f.age++;
    if(f.arrived||f.age>400)return false;
    const wp=f.waypts[Math.min(f.wpIdx,f.waypts.length-1)];
    const dx=wp[0]-f.x,dy=wp[1]-f.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<1.5){
      f.wpIdx++;
      if(f.wpIdx>=f.waypts.length){
        f.arrived=true;
        if(countries[f.attId]&&countries[f.defId]){
          const dup=wars.some(w=>!w.done&&
            ((w.attId===f.attId&&w.defId===f.defId)||
             (w.attId===f.defId&&w.defId===f.attId)));
          if(!dup){
            const aS=getStatsRaw(f.attId),dS=getStatsRaw(f.defId);
            if(aS&&dS){
              wars.push({attId:f.attId,defId:f.defId,round:0,done:false,
                attHp:aS.mhp*.7|0,defHp:dS.mhp,
                attMaxHp:aS.mhp*.7|0,defMaxHp:dS.mhp,
                fx:f.x|0,fy:f.y|0,naval:true});
              addEv(`⚓ ${countries[f.attId].name} lands on ${countries[f.defId].name}!`,'ld');
              ticker2(`⚓ NAVAL LANDING: ${countries[f.attId].name} invades ${countries[f.defId].name}!`);
            }
          }
        }
        return false;
      }
    } else {
      f.x+=dx/dist*1.4;
      f.y+=dy/dist*1.4;
    }
    return true;
  });
}

// ── STATS ──
// getStatsRaw: fast single-pass, no coastCheck (used in hot loops)
function getStatsRaw(cid){
  const c=countries[cid];if(!c)return null;
  let area=0,aS=0,dS=0,pS=0;
  for(let i=0;i<owner.length;i++){
    if(owner[i]!==cid)continue;
    area++;
    const t=TR[grid[i]];aS+=t.a;dS+=t.d;pS+=t.p;
  }
  const cb=cities.filter(x=>x.cid===cid).length;

  // Economy modifiers — gold funds armies, population provides manpower
  const gold=c.gold||0;
  const pop =c.pop ||1;
  // Gold bonus: +1 atk/def per 200 gold (capped at +20 each so huge stockpiles don't dominate)
  const goldAtk=Math.min(20, gold/200)|0;
  const goldDef=Math.min(20, gold/200)|0;
  // Population bonus: each 100k pop = +1 atk, +0.5 def, +5 max-hp
  const popAtk =(pop/100)|0;
  const popDef =(pop/200)|0;
  const popHp  =(pop/20) |0;

  const atk=Math.max(2,(area*.18+aS+cb*2+goldAtk+popAtk)|0);
  const def=Math.max(0,(area*.1 +dS+cb  +goldDef+popDef)|0);
  const mhp=Math.max(10,((area*.5+pS+cb*5)*2+area*2+cb*20+popHp)|0);
  return{name:c.name,color:c.color,area,atk,def,mhp,id:cid,cb,
         loyalty:c.loyalty||.7,gold,pop,morale:c.morale||1};
}

  const s=getStatsRaw(cid);if(!s)return null;
  s.coastal=isCoastal(cid);

}

// ── ALLIANCE ENGINE ──
let allianceIdSeq=0;
const AL_NAMES=['Pact','Coalition','League','Alliance','Union','Accord','Treaty','Bloc','Order','Compact'];
const AL_COLORS=['#ffaa00','#44aaff','#aa44ff','#ff44aa','#44ffaa','#ff8844','#44ffff','#ffff44','#ff4444','#88ff44'];

function getAlliance(cid){return alliances.find(al=>al.members.includes(cid))||null;}

function formAlliance(cids,name){
  // Don't allow two members who are at war with each other
  const validMembers=cids.filter(cid=>countries[cid]&&countT(cid)>0);
  if(validMembers.length<2)return null;
  const color=AL_COLORS[allianceIdSeq%AL_COLORS.length];
  const al={id:allianceIdSeq++,name:name||`${countries[validMembers[0]].name} ${AL_NAMES[Math.random()*AL_NAMES.length|0]}`,members:[...validMembers],color};
  alliances.push(al);
  addEv(`🤝 ${al.name} formed: ${validMembers.map(c=>countries[c]?.name).join(', ')}`,'ld');
  ticker2(`🤝 ${al.name} — new alliance!`);
  return al;
}

function dissolveAlliance(alId){
  const idx=alliances.findIndex(a=>a.id===alId);
  if(idx<0)return;
  addEv(`💔 ${alliances[idx].name} dissolved`,'li');
  alliances.splice(idx,1);
  refreshAlliancePanel();
}

// Player-triggered full demolish with confirmation
function demolishAlliance(alId){
  const al=alliances.find(a=>a.id===alId);
  if(!al)return;
  if(!confirm(`Demolish the ${al.name}? All member nations will become unallied.`))return;
  dissolveAlliance(alId);
  if(mode==='events')refreshEUI();
}

// Kick a single member out of an alliance
function kickFromAlliance(alId,cid){
  const al=alliances.find(a=>a.id===alId);
  if(!al)return;
  const c=countries[cid];
  if(!c)return;
  al.members=al.members.filter(m=>m!==cid);
  addEv(`🚪 ${c.name} removed from ${al.name}`,'li');
  if(al.members.length<2)dissolveAlliance(alId);
  if(mode==='events')refreshAlliancePanel();
}

function addToAlliance(alId,cid){
  const al=alliances.find(a=>a.id===alId);
  if(!al||al.members.includes(cid))return;
  al.members.push(cid);
  addEv(`🤝 ${countries[cid]?.name} joins ${al.name}`,'ld');
  refreshAlliancePanel();
}

function removeFromAlliance(alId,cid){
  const al=alliances.find(a=>a.id===alId);
  if(!al)return;
  al.members=al.members.filter(m=>m!==cid);
  if(al.members.length<2)dissolveAlliance(alId);
}

function promptNewAlliance(){
  if(countries.length<2){alert('Need at least 2 countries!');return;}
  const opts=countries.filter(c=>countT(c.id)>0);
  const picks=[];
  // Simple prompt: pick first two unallied nations
  opts.forEach(c=>{if(!getAlliance(c.id)&&picks.length<2)picks.push(c.id);});
  if(picks.length<2){alert('Need at least 2 unallied countries to form a new alliance.');return;}
  formAlliance(picks);
  if(mode==='events')refreshEUI();
}

// ── CALLED ON WAR DECLARATION: notify allies, maybe they join ──
function notifyAlliesOfWar(attId,defId){
  // Defender's alliance may call members to war
  const defAlliance=getAlliance(defId);
  if(defAlliance){
    defAlliance.members.forEach(mid=>{
      if(mid===defId||mid===attId)return;
      if(!countries[mid]||!countries[mid].aiEnabled)return;
      if(wars.some(w=>!w.done&&(w.attId===mid||w.defId===mid)))return;
      if(countT(mid)<3)return;
      // Willingness to join: loyalty-like check using morale + aggression
      const willingness=0.4+(countries[mid].morale||1)*.3+(countries[mid].loyalty||.7)*.2;
      if(Math.random()<willingness){
        declWarAllied(mid,attId,defAlliance.name);
      }
    });
  }
  // Attacker's alliance members may pile on (opportunism)
  const attAlliance=getAlliance(attId);
  if(attAlliance){
    attAlliance.members.forEach(mid=>{
      if(mid===attId||mid===defId)return;
      if(!countries[mid]||!countries[mid].aiEnabled)return;
      if(wars.some(w=>!w.done&&(w.attId===mid||w.defId===mid)))return;
      if(countT(mid)<3)return;
      const willingness=(countries[mid].aggression||.3)*.6+Math.random()*.3;
      if(willingness>0.55){
        declWarAllied(mid,defId,attAlliance.name);
      }
    });
  }
}

function declWarAllied(attId,defId,allianceName){
  const aS=getStatsRaw(attId),dS=getStatsRaw(defId);
  if(!aS||!dS||aS.area<2||dS.area<1)return;
  // Don't attack if already in a war against this nation
  if(wars.some(w=>!w.done&&((w.attId===attId&&w.defId===defId)||(w.attId===defId&&w.defId===attId))))return;
  wars.push({attId,defId,round:0,done:false,
    attHp:aS.mhp,defHp:dS.mhp,attMaxHp:aS.mhp,defMaxHp:dS.mhp,
    attMorale:Math.min(1.3,(countries[attId].morale||1)*1.1),
    defMorale:Math.min(1.4,(countries[defId].morale||1)*1.2),
    attExhaustion:0,defExhaustion:0,attSupply:1,defSupply:1,
    fx:null,fy:null,naval:false,peaceSued:false,allied:true});
  addEv(`🤝⚔️ ${countries[attId].name} joins ${allianceName} war vs ${countries[defId].name}`,'ld');
}

// ── AI DIPLOMACY TICK ──
// AI nations form alliances based on shared enemies, proximity, and relative power
function allianceTick(){
  if(countries.length<3)return;
  countries.forEach(c=>{
    if(!c.aiEnabled||countT(c.id)<3)return;
    if(c.peaceTimer>5)return;

    const myAl=getAlliance(c.id);

    if(!myAl){
      // Unallied: try to find or join an alliance
      // 1. Try to join an existing alliance whose members are neighbours or share enemies
      const cNB=getNB(c.id);
      for(const al of alliances){
        if(al.members.length>=6)continue;
        const friendly=al.members.some(mid=>cNB.has(mid)||!wars.some(w=>!w.done&&((w.attId===c.id&&w.defId===mid)||(w.attId===mid&&w.defId===c.id))));
        if(friendly&&Math.random()<0.18/aiSpeed){
          addToAlliance(al.id,c.id);
          return;
        }
      }
      // 2. Form a brand-new alliance with the best candidate
      const candidates=countries.filter(d=>{
        if(!d||d.id===c.id||!d.aiEnabled)return false;
        if(countT(d.id)<3)return false;
        if(wars.some(w=>!w.done&&((w.attId===c.id&&w.defId===d.id)||(w.attId===d.id&&w.defId===c.id))))return false;
        return true;
      });
      if(!candidates.length)return;

      let best=null,bs=-Infinity;
      candidates.forEach(d=>{
        const dNB=getNB(d.id);
        const shared=[...cNB].filter(x=>dNB.has(x)).length;
        const cS=getStatsRaw(c.id),dS=getStatsRaw(d.id);if(!cS||!dS)return;
        const powerBalance=1-Math.abs(cS.atk-dS.atk)/(cS.atk+dS.atk+1);
        // Boost score if d is already in an alliance (merge opportunity)
        const alBonus=getAlliance(d.id)?1.5:0;
        const score=shared*2+powerBalance+alBonus+Math.random()*0.8;
        if(score>bs){bs=score;best=d;}
      });

      // High formation chance: ~12% per tick this runs
      const allianceChance=0.12*(1+bs*.3)/Math.max(1,aiSpeed*.5);
      if(best&&Math.random()<allianceChance){
        // If best is already in an alliance, join that one instead of forming new
        const bestAl=getAlliance(best.id);
        if(bestAl&&bestAl.members.length<6)addToAlliance(bestAl.id,c.id);
        else formAlliance([c.id,best.id]);
      }
    } else {
      // Already in alliance: try to recruit nearby unallied nations
      if(myAl.members.length>=6)return;
      const cNB=getNB(c.id);
      for(const nid of cNB){
        const d=countries[nid];
        if(!d||!d.aiEnabled||getAlliance(nid))continue;
        if(countT(nid)<3)continue;
        if(wars.some(w=>!w.done&&((w.attId===c.id&&w.defId===nid)||(w.attId===nid&&w.defId===c.id))))continue;
        if(Math.random()<0.14/aiSpeed){
          addToAlliance(myAl.id,nid);
          break;
        }
      }
    }
  });

  // Existing alliances: recruit nations sharing current enemies
  alliances.forEach(al=>{
    if(al.members.length>=6)return;
    const enemies=new Set();
    al.members.forEach(cid=>{
      wars.filter(w=>!w.done).forEach(w=>{
        if(w.attId===cid)enemies.add(w.defId);
        if(w.defId===cid)enemies.add(w.attId);
      });
    });
    if(!enemies.size)return;
    countries.forEach(c=>{
      if(!c.aiEnabled||al.members.includes(c.id)||getAlliance(c.id))return;
      if(countT(c.id)<3||c.peaceTimer>15)return;
      const cNB=getNB(c.id);
      const sharesThreat=[...enemies].some(eid=>cNB.has(eid));
      if(sharesThreat&&Math.random()<0.18/aiSpeed){
        addToAlliance(al.id,c.id);
      }
    });
  });

  // Clean up dead members
  alliances.forEach(al=>{
    al.members=al.members.filter(cid=>countries[cid]&&countT(cid)>0);
  });
  alliances=alliances.filter(al=>al.members.length>=2);
}

// ── AI ──
// FIX: removed duplicate 'let revolts=[]' that was inside toggleAI — it shadowed the global,
// causing revolts to never render or process correctly after AI was toggled.
function toggleAI(){
  aiOn=!aiOn;
  const btn=document.getElementById('ai-btn');
  const spdrow=document.getElementById('spdrow');
  btn.textContent=aiOn?'⏸ AI':'▶ AI';
  btn.classList.toggle('active',aiOn);
  spdrow.style.display=aiOn?'flex':'none';
  // FIX: clear stale revolts when stopping AI so ghost flashes don't persist on canvas
  if(!aiOn){
    clearInterval(aiTimer);
    aiTimer=null;
    revolts.length=0;
    fleets.length=0;
    redraw();
  } else {
    startLoop();
  }
}
function setSpeed(s){aiSpeed=s;document.querySelectorAll('.spd').forEach(b=>b.classList.toggle('active',+b.dataset.s===s));if(aiOn){clearInterval(aiTimer);startLoop();}}
function startLoop(){clearInterval(aiTimer);aiTimer=setInterval(aiTick,Math.max(25,400/aiSpeed));}

function aiTick(){
  tick++;
  // Rebuild coast cache once per tick if dirty (not per-country call)
  if(coastDirty)rebuildCoastCache();

  wars.forEach(w=>{if(!w.done)runWar(w);});wars=wars.filter(w=>!w.done);
  stepFleets();

  countries.forEach(c=>{
    if(!c.aiEnabled||c.peaceTimer>0){if(c.peaceTimer>0)c.peaceTimer--;return;}
    if(countT(c.id)<3)return;
    if(wars.some(w=>w.attId===c.id||w.defId===c.id))return;
    if(fleets.some(f=>f.attId===c.id))return;

    if(Math.random()<c.aggression*(0.5/aiSpeed+0.07)){
      const nb=getNB(c.id);
      // Filter out alliance members from attack pool
      const myAlliance=getAlliance(c.id);
      const attackableNB=myAlliance?[...nb].filter(id=>!myAlliance.members.includes(id)):[...nb];
      if(attackableNB.length>0&&Math.random()<0.72){
        // Land attack
        const t=pickTgt(c.id,attackableNB);
        if(t!==null)declWar(c.id,t);
      } else if(coastCache[c.id]&&coastCache[c.id].length>0&&Math.random()<0.35){
        // Naval attack — use cached coast, pick target with getStatsRaw
        const aS=getStatsRaw(c.id);if(!aS)return;
        let best=null,bs=-Infinity;
        for(const d of countries){
          if(!d||d.id===c.id||!d.aiEnabled)continue;
          if(nb.has(d.id))continue;
          if(myAlliance&&myAlliance.members.includes(d.id))continue; // don't attack allies
          if(countT(d.id)<5)continue;
          if(fleets.some(f=>f.attId===c.id&&f.defId===d.id))continue;
          if(wars.some(w=>!w.done&&((w.attId===c.id&&w.defId===d.id)||(w.attId===d.id&&w.defId===c.id))))continue;
          if(!(coastCache[d.id]&&coastCache[d.id].length>0))continue;
          const dS=getStatsRaw(d.id);if(!dS)continue;
          const score=(aS.atk-dS.def*.8)+Math.random()*4;
          if(score>bs){bs=score;best=d;}
        }
        if(best)launchFleet(c.id,best.id);
      }
    }
  });

  if(tick%Math.max(3,30/aiSpeed)===0)checkRevolts();
  if(tick%Math.max(2,ECO_INTERVAL/aiSpeed*2|0)===0)ecoTick();
  if(tick%Math.max(1,8/aiSpeed)===0)allianceTick();
  revolts=revolts.filter(rv=>{rv.ticks++;rv.flash=(rv.ticks%4<2);if(rv.ticks>Math.max(5,20/aiSpeed)){trigRevolt(rv);return false;}return true;});
  updStatus();redraw();if(mode==='events')refreshEUI();
}

function getNB(cid){const nb=new Set();for(let row=0;row<ROWS;row++)for(let col=0;col<COLS;col++){if(owner[row*COLS+col]!==cid)continue;[[col-1,row],[col+1,row],[col,row-1],[col,row+1]].forEach(([nc,nr])=>{if(nc>=0&&nc<COLS&&nr>=0&&nr<ROWS){const nid=owner[nr*COLS+nc];if(nid>=0&&nid!==cid&&countries[nid])nb.add(nid);}});}return nb;}

// ── REALISTIC TARGET SELECTION ──
// Prefer: weaker neighbours, bordering heavily, low morale targets
function pickTgt(attId,targets){
  let best=null,bs=-Infinity;
  const aS=getStatsRaw(attId);if(!aS)return null;
  targets.forEach(tid=>{
    const tS=getStatsRaw(tid);if(!tS||tS.area<1)return;
    const powerRatio=aS.atk/(Math.max(1,tS.def)); // prefer weaker targets
    const sizeLure  =Math.log(1+tS.area)*.5;       // larger nations are more tempting
    const goldLure  =Math.log(1+tS.gold)*.3;        // wealth is attractive
    const moralePen =(countries[tid]?.morale||1);    // low morale = easier target
    const score=powerRatio+sizeLure+goldLure+(1-moralePen)+Math.random()*1.5;
    if(score>bs){bs=score;best=tid;}
  });
  return best;
}

// ── WAR DECLARATION ──
function declWar(attId,defId){
  if(!countries[attId]||!countries[defId])return;
  const aS=getStatsRaw(attId),dS=getStatsRaw(defId);
  if(!aS||aS.area<3||!dS||dS.area<1)return;

  // Attacker's morale starts high; defender starts at full morale (defending homeland)
  const attMorale=Math.min(1.2, (countries[attId].morale||1)*1.1);
  const defMorale=Math.min(1.3, (countries[defId].morale||1)*1.2); // defender bonus

  wars.push({
    attId,defId,round:0,done:false,
    // HP now scaled by morale and population, not just territory
    attHp:aS.mhp, defHp:dS.mhp,
    attMaxHp:aS.mhp, defMaxHp:dS.mhp,
    // Morale tracks will-to-fight (0=collapse, 1=normal, 1.3=peak)
    attMorale, defMorale,
    // War exhaustion accumulates over time — drains morale and gold
    attExhaustion:0, defExhaustion:0,
    // Supply tracks logistics — cut supply = penalty to attack
    attSupply:1.0, defSupply:1.0,
    // Front line location for rendering
    fx:null,fy:null,
    naval:false,
    // Peace offers: if morale < threshold, loser sues for peace
    peaceSued:false,
  });
  addEv(`⚔️ ${countries[attId].name} declares war on ${countries[defId].name}`,'la');
  ticker2(`⚔️ ${countries[attId].name} attacks ${countries[defId].name}!`);
  // War declaration lowers morale of both slightly
  if(countries[attId])countries[attId].morale=Math.min(1.2,attMorale);
  if(countries[defId])countries[defId].morale=Math.min(1.3,defMorale);
  // Notify allies — they may join
  notifyAlliesOfWar(attId,defId);
}

// ── REALISTIC WAR RESOLUTION ──
// Factors: terrain, supply lines, morale, war exhaustion, gold/manpower, defender bonus
function runWar(w){
  w.round++;
  const aC=countries[w.attId],dC=countries[w.defId];
  const aS=getStatsRaw(w.attId),dS=getStatsRaw(w.defId);
  if(!aS||!dS||aS.area<1||dS.area<1){
    endWar(w,(!aS||aS.area<1)?w.defId:w.attId,(!aS||aS.area<1)?w.attId:w.defId);
    return;
  }

  // ── SUPPLY LINES ──
  // Attacker's supply degrades as they push deep into enemy territory
  // (ratio of owned border tiles to total front — longer front = worse supply)
  const frontLen=getFrontLength(w.attId,w.defId);
  const supplyStrain=Math.min(1, frontLen/(aS.area*.3+1));
  w.attSupply=Math.max(0.4, 1-supplyStrain*.4);
  // Defender has home-supply advantage
  w.defSupply=Math.min(1.1, 0.9+(dC?.loyalty||.7)*.2);

  // ── TERRAIN MODIFIER ──
  // Battle happens at the front tile — check its terrain
  const bt=getBT(w.attId,w.defId);
  if(bt){w.fx=bt.col;w.fy=bt.row;}
  let terrainMod=1.0;
  if(bt){
    const t=TR[grid[bt.row*COLS+bt.col]];
    // Mountain/forest/swamp heavily favours defender
    terrainMod=1+t.d*.08; // defender gets terrain bonus
  }

  // ── MORALE ──
  const am=Math.max(0.1, w.attMorale||1);
  const dm=Math.max(0.1, w.defMorale||1);

  // ── GOLD FUNDS THE WAR ──
  // Nations with empty treasuries fight at reduced effectiveness
  const goldA=Math.min(1.3, 0.6+(aC?.gold||0)/300);
  const goldD=Math.min(1.3, 0.6+(dC?.gold||0)/300);

  // ── POPULATION = MANPOWER ──
  const manA=Math.min(1.3, 0.7+(aS.pop||1)/500);
  const manD=Math.min(1.3, 0.7+(dS.pop||1)/500);

  // ── COMPUTE EFFECTIVE ATTACK/DEFENCE ──
  const effAtk=aS.atk * am * w.attSupply * goldA * manA;
  const effDef=dS.def * dm * w.defSupply * goldD * manD * terrainMod;

  // Damage formula: attacker punches into defender's HP, defender counter-attacks
  const baseADmg=Math.max(1,(effAtk*(.8+Math.random()*.4) - effDef*(.5+Math.random()*.3))|0);
  const baseDBsm=Math.max(1,(aS.atk*(.5+Math.random()*.3)*dm*goldD - effDef*(.2+Math.random()*.2))|0);
  const aDmg=Math.max(0,baseADmg);
  const dDmg=Math.max(1,baseDBsm); // defender always inflicts some casualties

  w.defHp=Math.max(0,w.defHp-aDmg);
  w.attHp=Math.max(0,w.attHp-dDmg);

  // ── TERRITORIAL PROGRESS ──
  // Only gain tiles if attacker is clearly winning the exchange
  if(aDmg>dDmg*1.2){
    conqTile(w.attId,w.defId);
  } else if(dDmg>aDmg*1.4 && w.round>3){
    // Strong defensive performance — push attacker back
    conqTile(w.defId,w.attId);
  }

  // ── WAR EXHAUSTION ──
  // Rises each round; faster if taking heavy casualties or spending lots of gold
  w.attExhaustion=(w.attExhaustion||0)+(dDmg/(w.attMaxHp+1))*0.8+0.004;
  w.defExhaustion=(w.defExhaustion||0)+(aDmg/(w.defMaxHp+1))*0.6+0.002; // defender endures better
  // Drain gold each round (war maintenance)
  if(aC)aC.gold=Math.max(0,aC.gold-Math.max(1,(aS.area/40)|0));
  if(dC)dC.gold=Math.max(0,dC.gold-Math.max(1,(dS.area/60)|0));
  // Exhaustion degrades morale
  w.attMorale=Math.max(0.05,(w.attMorale||1)-w.attExhaustion*.015);
  w.defMorale=Math.max(0.05,(w.defMorale||1)-w.defExhaustion*.01);

  // ── MORALE COLLAPSE ──
  // A side whose morale crashes sues for peace before HP hits zero (real-world wars end this way)
  const attMoraleCollapse=w.attMorale<0.18&&w.round>5;
  const defMoraleCollapse=w.defMorale<0.12&&w.round>5;
  // HP exhaustion
  const attHpLow=w.attHp<=0;
  const defHpLow=w.defHp<=0;

  if((defHpLow||defMoraleCollapse)&&(attHpLow||attMoraleCollapse)){
    // Both sides broken — armistice
    w.done=true;
    addEv(`🕊️ Exhausted armistice: ${aC?.name} & ${dC?.name}`,'li');
    ticker2(`🕊️ Armistice! Both sides exhausted.`);
    [w.attId,w.defId].forEach(id=>{
      if(countries[id]){countries[id].peaceTimer=20;countries[id].morale=Math.max(0.3,countries[id].morale-.15);}
    });
  } else if(defHpLow||defMoraleCollapse){
    if(!w.peaceSued&&w.defMorale<0.2&&!defHpLow){
      // Defender sues for peace — partial concession, not total collapse
      w.peaceSued=true;
      addEv(`🏳️ ${dC?.name} sues for peace with ${aC?.name}`,'li');
      ticker2(`🏳️ ${dC?.name} surrenders territory to ${aC?.name}`);
      // Transfer a chunk of tiles but nation survives
      const tilesToCede=Math.max(1,(countT(w.defId)*.3)|0);
      for(let i=0;i<tilesToCede;i++)conqTile(w.attId,w.defId);
      endWarPeace(w,w.attId,w.defId,false);
    } else {
      endWar(w,w.attId,w.defId);
    }
  } else if(attHpLow||attMoraleCollapse){
    endWar(w,w.defId,w.attId);
  }
}

// ── WAR END VARIANTS ──
// Peace treaty (non-total victory — loser survives but weakened)
function endWarPeace(w,wId,lId,mutual){
  w.done=true;
  const wn=countries[wId]?.name||'?',ln=countries[lId]?.name||'?';
  addEv(`📜 ${wn} imposes terms on ${ln}`,'lw');
  // Indemnity: loser pays war reparations in gold
  const indemnity=Math.min(countries[lId]?.gold||0, (countries[lId]?.gold||0)*.35|0);
  if(countries[wId])countries[wId].gold+=(countries[wId].gold||0)+indemnity;
  if(countries[lId])countries[lId].gold=Math.max(0,(countries[lId].gold||0)-indemnity);
  if(countries[wId])countries[wId].peaceTimer=8;
  if(countries[lId]){
    countries[lId].peaceTimer=40;
    countries[lId].morale=Math.max(0.2,(countries[lId].morale||1)*.6);
    countries[lId].loyalty=Math.max(.1,(countries[lId].loyalty||.7)-.2);
  }
  rclList();
}

// Total defeat — loser fully absorbed
function endWar(w,wId,lId){
  w.done=true;
  const wn=countries[wId]?.name||'?',ln=countries[lId]?.name||'?';
  addEv(`🏆 ${wn} defeats ${ln}!`,'lw');
  ticker2(`🏆 ${wn} conquers ${ln}!`);
  lootVictory(wId,lId);
  capFull(lId,wId);
  if(countries[wId]){
    countries[wId].peaceTimer=5;
    countries[wId].morale=Math.min(1.4,(countries[wId].morale||1)+.15); // victory euphoria
  }
  if(countries[lId]){
    countries[lId].peaceTimer=35;
    countries[lId].aggression=Math.max(.05,countries[lId].aggression*.7);
    countries[lId].loyalty=Math.max(.05,(countries[lId].loyalty||.7)-.2);
    countries[lId].morale=Math.max(.1,(countries[lId].morale||1)*.4);
    countries[lId].gold=Math.max(0,(countries[lId].gold||0)*.5|0);
    countries[lId].pop =Math.max(1,(countries[lId].pop ||1)*.75|0);
  }
  rclList();
}

// Get approximate front length (contested border tiles)
function getFrontLength(aId,dId){
  let count=0;
  for(let row=0;row<ROWS&&count<80;row+=2)for(let col=0;col<COLS;col+=2){
    if(owner[row*COLS+col]!==aId)continue;
    for(const[nc,nr]of[[col-1,row],[col+1,row],[col,row-1],[col,row+1]]){
      if(nc>=0&&nc<COLS&&nr>=0&&nr<ROWS&&owner[nr*COLS+nc]===dId){count++;break;}
    }
  }
  return count;
}

function conqTile(wId,lId){
  const bt=getBT(wId,lId);
  if(!bt)return;
  const i=bt.row*COLS+bt.col;
  owner[i]=wId;
  dirtyCoast();
  const ci=cities.findIndex(c=>c.x===bt.col&&c.y===bt.row);
  if(ci>=0){
    const city=cities[ci];
    if(city.isCapital&&city.cid===lId){
      // Capital captured — country collapses!
      collapseCountry(lId,wId,city.name);
      return;
    }
    cities[ci].cid=wId;
    if(countries[wId])cities[ci].color=countries[wId].color;
  }
}

// Collapse a country whose capital was taken. All tiles absorbed by conqueror.
function collapseCountry(loserId,conquId,capitalName){
  const loser=countries[loserId],conq=countries[conquId];
  if(!loser||!conq)return;
  addEv(`💥 ${capitalName} falls! ${loser.name} COLLAPSES → ${conq.name}`,'lw');
  ticker2(`💥 ${loser.name} has fallen! Capital ${capitalName} seized by ${conq.name}!`);
  lootVictory(conquId,loserId);
  // Transfer all tiles and cities to conqueror
  for(let i=0;i<owner.length;i++)if(owner[i]===loserId)owner[i]=conquId;
  cities.forEach(c=>{
    if(c.cid===loserId){
      c.cid=conquId;
      c.color=conq.color;
      c.isCapital=false; // absorbed cities lose capital status
    }
  });
  // End any active wars involving the collapsed nation
  wars.forEach(w=>{
    if(!w.done&&(w.attId===loserId||w.defId===loserId))w.done=true;
  });
  fleets=fleets.filter(f=>f.attId!==loserId&&f.defId!==loserId);
  loser.gold=0; loser.pop=0;
  loser.peaceTimer=999;
  dirtyCoast();
  redraw();
  rclList();
  fillSels();
}
function getBT(aId,dId){const c=[];for(let row=0;row<ROWS&&c.length<40;row++)for(let col=0;col<COLS;col++){if(owner[row*COLS+col]!==dId)continue;let t=false;[[col-1,row],[col+1,row],[col,row-1],[col,row+1]].forEach(([nc,nr])=>{if(nc>=0&&nc<COLS&&nr>=0&&nr<ROWS&&owner[nr*COLS+nc]===aId)t=true;});if(t){c.push({col,row});if(c.length>=40)break;}}return c.length?c[Math.random()*c.length|0]:null;}

// ── ECONOMY TICK ──
// Runs every N ticks (not every tick — keep it light)
const ECO_INTERVAL=8; // ticks between economy updates

function ecoTick(){
  countries.forEach(c=>{
    if(!countries[c.id])return;
    const area=countT(c.id);
    if(area===0)return;
    const cb=cities.filter(x=>x.cid===c.id).length;

    // ── GOLD INCOME ──
    // Base: 1 gold/tick per 10 tiles (farmland tiles give 2x)
    let income=0;
    for(let i=0;i<owner.length;i++){
      if(owner[i]!==c.id)continue;
      const t=TR[grid[i]];
      income += t.p>0 ? 2 : (grid[i]===O?0:1); // farmland earns double
    }
    income = (income/10)|0;
    income += cb*3;  // cities are major gold sources
    // War costs gold (each active war drains treasury)
    const activeWars=wars.filter(w=>!w.done&&(w.attId===c.id||w.defId===c.id)).length;
    const warCost=activeWars*Math.max(2,(area/30)|0);
    c.gold=Math.max(0, c.gold + income - warCost);

    // ── POPULATION GROWTH ──
    // Base growth rate: ~1-3% per eco cycle depending on terrain/cities
    // Farmland and plains boost growth; desert/snow penalise
    let growthRate=0.012 + cb*0.002;
    // Terrain bonus (sampled — not full scan, use area proxy)
    if(area>0)growthRate+=Math.min(0.01, pS_estimate(c.id)/area*0.005);
    // War reduces population
    if(activeWars>0)growthRate-=activeWars*0.004;
    // Low gold starves people
    if(c.gold<10)growthRate-=0.008;
    growthRate=Math.max(-0.02,Math.min(0.04,growthRate));

    // Accumulate fractional growth then apply whole units
    c.popGrowthAcc=(c.popGrowthAcc||0)+c.pop*growthRate;
    if(Math.abs(c.popGrowthAcc)>=1){
      c.pop=Math.max(1,c.pop+(c.popGrowthAcc|0));
      c.popGrowthAcc-=(c.popGrowthAcc|0);
    }
    // ── MORALE RECOVERY ──
    // Nations recover morale slowly in peacetime; faster with gold and high loyalty
    const inWar=wars.some(w=>!w.done&&(w.attId===c.id||w.defId===c.id));
    if(!inWar&&(c.morale||1)<1.0){
      const rec=0.008+(c.gold>50?0.004:0)+(c.loyalty>.7?0.003:0);
      c.morale=Math.min(1.0,(c.morale||1)+rec);
    }
    // Hard cap: population can't exceed area*20 (overcrowding)
    c.pop=Math.min(c.pop, area*20);
  });
}

// Cheap terrain productivity estimate (samples every 4th tile)
function pS_estimate(cid){
  let ps=0;
  for(let i=0;i<owner.length;i+=4){
    if(owner[i]===cid)ps+=TR[grid[i]].p;
  }
  return ps;
}

// When a war is won: winner loots gold and absorbs some population
function lootVictory(winnerId,loserId){
  const w=countries[winnerId],l=countries[loserId];
  if(!w||!l)return;
  const goldTaken=Math.min(l.gold, (l.gold*.4)|0);
  const popAbsorbed=Math.min(l.pop, (l.pop*.25)|0);
  w.gold+=goldTaken;
  w.pop +=popAbsorbed;
  if(goldTaken>0||popAbsorbed>0){
    addEv(`💰 ${w.name} loots ${goldTaken}g, gains ${popAbsorbed}k pop from ${l.name}`,'lw');
  }
}
function checkRevolts(){
  countries.forEach(c=>{
    if(!c.aiEnabled)return;
    const tiles=countT(c.id);if(tiles<18)return;
    const prob=(1-c.loyalty)*(tiles/400)*(.12/aiSpeed+.015);
    if(Math.random()<prob){
      const rt=findRevTile(c.id);
      if(rt){revolts.push({x:rt.col,y:rt.row,cid:c.id,ticks:0,flash:true,size:Math.max(4,tiles*.09|0)});addEv(`🔥 Revolt brewing in ${c.name}!`,'lr');ticker2(`🔥 REVOLT in ${c.name}!`);}
    }
  });
}
function findRevTile(cid){const cands=[];for(let row=0;row<ROWS;row+=2)for(let col=0;col<COLS;col+=2){if(owner[row*COLS+col]===cid&&grid[row*COLS+col]!==O)cands.push({col,row});}if(!cands.length)return null;return cands.sort(()=>Math.random()-.5).slice(0,20)[0];}
function trigRevolt(rv){
  const parent=countries[rv.cid];if(!parent)return;
  const pArr=parent.name.split(' ');const baseName=pArr[pArr.length-1]||'Land';
  const rname=RN[Math.random()*RN.length|0]+' '+baseName;
  const pr=crgb(parent.color);
  const rc='#'+[Math.min(255,255-pr[0]+Math.random()*80|0),Math.min(255,255-pr[1]+Math.random()*80|0),Math.min(255,255-pr[2]+Math.random()*80|0)].map(x=>x.toString(16).padStart(2,'0')).join('');
  const newId=addC(rname,rc,{ag:.5+Math.random()*.3,ai:true,rebel:true,ly:.4+Math.random()*.25});
  const transferred=new Set();const q=[[rv.x,rv.y]];const vis=new Set();
  while(q.length&&transferred.size<rv.size){const[c,r]=q.shift();const k=r*COLS+c;if(vis.has(k))continue;vis.add(k);if(c<0||c>=COLS||r<0||r>=ROWS)continue;if(owner[k]===rv.cid&&grid[k]!==O){owner[k]=newId;transferred.add(k);const ci=cities.findIndex(ct=>ct.x===c&&ct.y===r);if(ci>=0){cities[ci].cid=newId;cities[ci].color=rc;}q.push([c+1,r],[c-1,r],[c,r+1],[c,r-1]);}}
  dirtyCoast();
  if(transferred.size>0){const arr=[...transferred];const s=arr[Math.random()*arr.length|0];const sc=s%COLS,sr=s/COLS|0;if(!cities.find(ct=>ct.x===sc&&ct.y===sr))ac(sc,sr,CN[Math.random()*CN.length|0],newId);}
  if(transferred.size>2){const nS=getStats(newId),pS=getStats(rv.cid);wars.push({attId:newId,defId:rv.cid,round:0,done:false,attHp:nS?.mhp||15,defHp:pS?.mhp||50,attMaxHp:nS?.mhp||15,defMaxHp:pS?.mhp||50,fx:rv.x,fy:rv.y});}
  addEv(`⚡ ${rname} breaks FREE from ${parent.name}!`,'lr');ticker2(`⚡ ${rname} declares independence!`);rclList();fillSels();
}

function addEv(text,cls){evlog.unshift({text,cls});if(evlog.length>80)evlog.pop();}
function refreshEUI(){
  const le=document.getElementById('evlogbody');if(le)le.innerHTML=evlog.length?`<div class="evlog">${evlog.map(e=>`<div class="evrow ${e.cls}">${e.text}</div>`).join('')}</div>`:'<div style="color:var(--dim);font-size:.74rem;font-style:italic;padding:4px">No events yet. Enable AI on countries and press ▶ AI!</div>';
  const ne=document.getElementById('natbody');if(ne){
    if(!countries.length){ne.innerHTML='<div style="color:var(--dim);font-size:.74rem">No countries.</div>';}
    else{
      const sorted=[...countries].sort((a,b)=>(b.gold||0)+(b.pop||0)*2-((a.gold||0)+(a.pop||0)*2));
      ne.innerHTML=`<table class="wtbl">
        <tr><th>Nation</th><th>★ Capital</th><th>💰</th><th>👥</th><th>😤</th><th>🤝</th><th>Status</th></tr>
        ${sorted.map(c=>{
          const cap=cities.find(x=>x.cid===c.id&&x.isCapital);
          const iw=wars.find(w=>!w.done&&(w.attId===c.id||w.defId===c.id));
          const nw=iw&&iw.naval;
          const rv=revolts.some(r=>r.cid===c.id);
          const fl=fleets.some(f=>f.attId===c.id);
          const coast=coastCache[c.id]&&coastCache[c.id].length>0;
          const goldStr=(c.gold||0)>999?((c.gold/1000).toFixed(1)+'k'):(c.gold||0);
          const popStr=(c.pop||0)+'k';
          const warMorale=iw?(c.id===iw.attId?iw.attMorale:iw.defMorale)||1:c.morale||1;
          const morPct=(warMorale/1.3*100)|0;
          const morColor=morPct>60?'#44cc88':morPct>30?'#f0b930':'#cc3333';
          const al=getAlliance(c.id);
          return`<tr>
            <td><span style="color:${c.color}">■</span> ${c.name}${c.isRebel?' ⚡':''}</td>
            <td style="color:#f0b930">${cap?cap.name:'<span style="color:#ff4444">–</span>'}</td>
            <td style="color:var(--gold)">${goldStr}</td>
            <td style="color:#44cc88">${popStr}</td>
            <td style="color:${morColor}">${morPct}%</td>
            <td>${al?`<span style="color:${al.color};font-size:.54rem">${al.name}</span>`:'–'}</td>
            <td>${nw?'⚓':iw?'⚔️':fl?'⛵':rv?'🔥':coast?'🌊':'☮️'}</td>
          </tr>`;
        }).join('')}
      </table>`;
    }
  }
  refreshAlliancePanel();
}

function refreshAlliancePanel(){
  const ae=document.getElementById('albody');if(!ae)return;
  if(!alliances.length){
    ae.innerHTML=`<div style="color:var(--dim);font-size:.74rem;font-style:italic;padding:4px">No alliances yet. They form automatically when AI nations share enemies, or create one below.</div>`+
      `<button class="acbtn" onclick="promptNewAlliance()" style="margin-top:6px">+ FORM ALLIANCE</button>`;
    return;
  }
  ae.innerHTML=alliances.map(al=>{
    const members=al.members.map(cid=>countries[cid]).filter(Boolean);
    const atWar=al.members.some(cid=>wars.some(w=>!w.done&&(w.attId===cid||w.defId===cid)));
    const addable=countries.filter(c=>!al.members.includes(c.id)&&countT(c.id)>0).slice(0,3);
    return`<div class="alblk">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div class="altit" style="color:${al.color};margin-bottom:0">🤝 ${al.name}${atWar?' <span style="color:#ff7744;font-size:.5rem">⚔️ WAR</span>':''}</div>
        <button onclick="demolishAlliance(${al.id})" style="font-family:'Cinzel',serif;font-size:.55rem;padding:4px 12px;background:#3a0000;border:2px solid #cc2222;color:#ff5555;border-radius:3px;cursor:pointer;letter-spacing:.08em;font-weight:700">💥 DEMOLISH</button>
      </div>
      <div class="almem">${members.map(c=>`<span style="background:${c.color}22;border:1px solid ${c.color}55;color:${c.color};cursor:pointer" onclick="kickFromAlliance(${al.id},${c.id})" title="Kick ${c.name}">${c.name} ✕</span>`).join('')}</div>
      ${addable.length?`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:3px"><span style="font-size:.5rem;color:var(--dim);align-self:center">Add:</span>${addable.map(c=>`<button class="albtn" onclick="addToAlliance(${al.id},${c.id})" style="color:${c.color};border-color:${c.color}44">+${c.name}</button>`).join('')}</div>`:''}
    </div>`;
  }).join('')+`<button class="acbtn" onclick="promptNewAlliance()" style="margin-top:4px">+ FORM ALLIANCE</button>`;
}
function ticker2(msg){const el=document.getElementById('etick');el.textContent=msg;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',3500);}
function updStatus(){
  const alive=countries.filter(c=>countT(c.id)>0);
  const aw=wars.filter(w=>!w.done).length;
  const nw=wars.filter(w=>!w.done&&w.naval).length;
  const totalPop=alive.reduce((s,c)=>s+(c.pop||0),0);
  const richest=alive.length?alive.reduce((a,b)=>(b.gold||0)>(a.gold||0)?b:a,alive[0]):null;
  document.getElementById('sb').textContent=
    `${alive.length} nations · ${aw} wars${nw?` (${nw}⚓)`:''} · ${fleets.length}⛵ · `+
    `🤝${alliances.length} alliances · 👥${totalPop}k · 💰${richest?richest.name+' '+richest.gold:'–'}`;
}
function setMode(m){mode=m;['draw','battle','events'].forEach(id=>document.getElementById('tab-'+id).classList.toggle('active',id===m));buildDrawer();}

document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT'].includes(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(k==='p')setTool('paint');if(k==='e')setTool('erase');if(k==='f')setTool('fill');if(k==='i')setTool('eyedrop');if(k==='c')setTool('city');
  if(e.key==='['){brush=Math.max(1,brush-1);const r=document.getElementById('brange');if(r){r.value=brush;document.getElementById('bval').textContent=brush;}}
  if(e.key===']'){brush=Math.min(20,brush+1);const r=document.getElementById('brange');if(r){r.value=brush;document.getElementById('bval').textContent=brush;}}
  if(e.key===' '){e.preventDefault();toggleAI();}
  if(e.key==='Escape')closeM();
});

window.addEventListener('DOMContentLoaded',()=>{
  // FIX: call buildDrawer BEFORE rclList so #clist exists in the DOM when rclList runs
  addC('Nordheim','#3355cc',{ag:.35,ai:true,ly:.72});
  addC('Solaris','#cc8833',{ag:.6,ai:true,ly:.55});
  addC('Verdania','#228844',{ag:.28,ai:true,ly:.8});
  addC('Ashkara','#cc3322',{ag:.72,ai:true,ly:.4});
  initCanvas();
  // fit() is called inside initCanvas→fit, so camera is already set correctly
  buildDrawer();   // drawer must exist before rclList/fillSels
  fillSels();
  updStatus();
});
</script>
