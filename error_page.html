<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error - WorldWide Internet Search Engine</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .error-container {
    text-align: center;
    padding: 40px;
    max-width: 600px;
  }
  .icon-container {
    position: relative;
    width: 150px;
    height: 150px;
    margin: 0 auto 30px;
  }
  .globe {
    width: 150px;
    height: 150px;
    background: linear-gradient(135deg, #0066cc 0%, #004499 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 10px 30px rgba(0, 102, 204, 0.3);
  }
  .globe::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: 
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2) 0%, transparent 50%),
      linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.1) 45%, transparent 50%);
  }
  .globe-lines {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
  }
  .globe-lines::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background: rgba(255,255,255,0.3);
  }
  .globe-lines::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: rgba(255,255,255,0.3);
  }
  .ban {
    position: absolute;
    width: 180px;
    height: 180px;
    top: -15px;
    left: -15px;
    border: 8px solid #cc0000;
    border-radius: 50%;
    transform: rotate(45deg);
    box-shadow: 0 5px 20px rgba(204, 0, 0, 0.4);
  }
  .error-title {
    font-size: 28px;
    font-weight: bold;
    color: #cc0000;
    margin-bottom: 20px;
    text-shadow: 0 2px 10px rgba(204, 0, 0, 0.3);
  }
  .error-message {
    font-size: 18px;
    color: #e0e0e0;
    margin-bottom: 30px;
    line-height: 1.6;
  }
  .error-message .apology {
    color: #ffaa00;
    font-style: italic;
  }
  .game-section {
    margin-top: 40px;
    padding: 30px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .game-title {
    font-size: 20px;
    color: #00ccff;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .game-frame {
    width: 100%;
    height: 400px;
    border: none;
    border-radius: 10px;
    background: #000;
  }
  .footer {
    margin-top: 30px;
    font-size: 12px;
    color: #666;
  }
</style>
</head>
<body>
  <div class="error-container">
    <div class="icon-container">
      <div class="globe">
        <div class="globe-lines"></div>
      </div>
      <div class="ban"></div>
    </div>
    
    <h1 class="error-title">ERROR</h1>
    
    <p class="error-message">
      Something went wrong with WorldWide Internet Search Engine<br>
      <span class="apology">our apologies (Unless it is your fault)</span>
    </p>
    
    <div class="game-section">
      <h2 class="game-title">Play this game while you wait:</h2>
      <iframe src="Warlands2.0.html" class="game-frame" title="Warlands Game"></iframe>
    </div>
    
    <p class="footer">WorldWide Internet Search Engine &copy; 2026</p>
  </div>
</body>
</html>
